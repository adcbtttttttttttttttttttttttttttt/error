<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚠️ 系统异常</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%;
    height:100%;
    height:100dvh;            /* 动态视口高度：地址栏收起/横屏/折叠屏都正确 */
    background:#fff; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    transition: background .8s ease;
  }
  body.dark { background:#0a0a0c; }

  body.paused .warn,
  body.paused #warnings,
  body.paused .fakeDialog { animation-play-state: paused !important; }

  #warnings {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:6px 10px;
    max-width:96vw;
    max-height:96vh;          /* fallback */
    max-height:96dvh;
    overflow:hidden; padding:2vmin; text-align:center;
  }

  .warn {
    display:inline-block;
    width:8vmin; height:8vmin;
    flex-shrink:0;
    animation: pulse 1.2s ease-in-out infinite;
    user-select:none; pointer-events:none;
    vertical-align:middle;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%     { opacity:.7; transform:scale(.92); }
  }

  #warnings.small .warn { width:5vmin;   height:5vmin; }
  #warnings.tiny  .warn { width:3.2vmin; height:3.2vmin; }
  #warnings.micro .warn { width:2vmin;   height:2vmin; }
  #warnings.ultra .warn { width:1.2vmin; height:1.2vmin; }
  #warnings.micro { gap:3px 6px; }
  #warnings.ultra { gap:2px 4px; }

  #warnings.shake { animation: shake .18s linear infinite; }
  @keyframes shake {
    0%   { transform:translate(0,0); }
    25%  { transform:translate(-2px,1px); }
    50%  { transform:translate(1px,-2px); }
    75%  { transform:translate(2px,1px); }
    100% { transform:translate(0,0); }
  }

  #escHint {
    position:fixed;
    top:calc(10px + env(safe-area-inset-top, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    z-index:3000;
    font:inherit; font-size:11px; letter-spacing:1px;
    color:#bbb; background:transparent; border:0;
    padding:6px 8px; cursor:pointer; user-select:none; border-radius:4px;
    transition:color .2s;
  }
  #escHint:hover, #escHint:focus-visible {
    color:#ff3b30; background:rgba(0,0,0,.05); outline:none;
  }

  #label {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:6vmin; font-weight:800;
    color:rgba(255,59,48,.85);
    text-shadow:0 0 20px rgba(255,59,48,.5);
    pointer-events:none; user-select:none;
    z-index:5; letter-spacing:2px; display:none;
  }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:8;
    opacity:0; transition:opacity 1.2s ease;
    background: radial-gradient(ellipse at center,
      transparent 30%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.9) 100%);
  }
  #vignette.on { opacity:1; }

  .fakeDialog {
    position:fixed;
    width:300px;
    max-width:calc(100vw - 16px);
    max-height:calc(100dvh - 16px);
    background:#f0f0f0; border:1px solid #999; border-radius:6px;
    box-shadow:0 8px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.15);
    font-size:13px; color:#1a1a1a; z-index:1000; overflow:hidden;
    animation: dlgIn .25s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes dlgIn {
    0%   { transform:scale(.85); opacity:0; }
    100% { transform:scale(1);   opacity:1; }
  }
  body.dark .fakeDialog { background:#2a2a2e; border-color:#555; color:#e8e8e8; }

  .fakeDialog .titlebar {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px 6px 10px;
    background:linear-gradient(#fbfbfb,#e8e8e8);
    border-bottom:1px solid #ccc;
    font-weight:600; font-size:12px; cursor:default;
    touch-action:none;
  }
  body.dark .fakeDialog .titlebar {
    background:linear-gradient(#3a3a40,#2a2a2e); border-bottom-color:#444;
  }
  .fakeDialog .btns span {
    display:inline-block; width:14px; height:14px; line-height:12px;
    text-align:center; border-radius:2px; font-size:10px;
    color:#555; background:#ddd; cursor:pointer; user-select:none;
  }
  .fakeDialog .btns span:hover { background:#ccc; }
  .fakeDialog .body { padding:14px 14px 16px; display:flex; gap:12px; align-items:flex-start; }
  .fakeDialog .body .icon {
    width:26px; height:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .fakeDialog .body .icon svg { display:block; width:100%; height:100%; }
  .fakeDialog .body .msg { line-height:1.45; word-break:break-word; }
  .fakeDialog .body .msg .sub { display:block; margin-top:6px; font-size:11px; opacity:.6; }
  .fakeDialog .footer { padding:0 14px 14px; text-align:right; }
  .fakeDialog .footer button {
    font:inherit; font-size:12px; padding:4px 16px;
    border:1px solid #aaa; border-radius:4px;
    background:linear-gradient(#fff,#eee); cursor:pointer;
  }
  .fakeDialog .footer button:hover { background:#f5f5f5; }
  body.dark .fakeDialog .footer button {
    background:linear-gradient(#444,#333); border-color:#666; color:#eee;
  }

  .fakeDialog.web { width:340px; }
  .fakeDialog .web-body { padding:8px; background:#111; }
  body.dark .fakeDialog .web-body { background:#0d0d10; }
  .fakeDialog .web-body iframe {
    display:block; width:100%; height:190px;
    border:1px solid #333; border-radius:3px;
    background:#000;
  }

  .fakeDialog.noise { width:320px; }
  .fakeDialog .noise-body {
    height:160px; padding:6px 8px;
    background:#050805; overflow:hidden;
  }
  body.dark .fakeDialog .noise-body { background:#020402; }
  .fakeDialog .noise-lines {
    height:100%; overflow:hidden;
    font-family:'Courier New', Consolas, 'Cascadia Code', monospace;
    font-size:11px; line-height:1.4;
    color:#39ff14;
    text-shadow:0 0 4px rgba(57,255,20,.45);
    white-space:pre;
  }
  .fakeDialog .noise-lines > div {
    white-space:pre; overflow:hidden; text-overflow:ellipsis;
  }
  .fakeDialog .noise-lines > div:last-child { color:#b6ffb0; }

  .fakeDialog.static { width:340px; }
  .fakeDialog .static-body {
    padding:8px;
    background:#111;
    position:relative;
  }
  body.dark .fakeDialog .static-body { background:#0d0d10; }
  .fakeDialog .static-body canvas {
    display:block;
    width:100%;
    height:190px;
    border:1px solid #333;
    border-radius:3px;
    background:#000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .fakeDialog .static-body::after {
    content:'';
    position:absolute;
    left:9px; right:9px; top:9px; bottom:9px;
    pointer-events:none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.28) 0px,
      rgba(0,0,0,0.28) 1px,
      transparent 1px,
      transparent 3px
    );
    border-radius:3px;
    mix-blend-mode: multiply;
  }

  @media (prefers-reduced-motion: reduce) {
    .warn, #warnings.shake { animation:none !important; }
  }
</style>
</head>
<body>

<script>
(async () => {
  'use strict';

  const $ = id => document.getElementById(id);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const params = new URLSearchParams(location.search);

  /* ================================================================
     sessionStorage 探测
     ================================================================ */
  const SS = (() => {
    try {
      const s = window.sessionStorage;
      s.setItem('__probe', '1');
      s.removeItem('__probe');
      return s;
    } catch (e) { return null; }
  })();

  const readNum = k => {
    try { return parseInt(SS && SS.getItem(k), 10) || 0; }
    catch (e) { return 0; }
  };
  const writeNum = (k, v) => {
    try { SS && SS.setItem(k, String(v)); } catch (e) {}
  };

  /* ================================================================
     四层存储（按 id 哈希分片）
     ================================================================ */
  const Storage = (() => {
    const mem = new Map();
    let idb = null, opfsRoot = null, cache = null;

    function shard(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
      return h % 4;
    }

    async function init() {
      try {
        idb = await new Promise((res, rej) => {
          const req = indexedDB.open('sysFault', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('dialogs')) {
              db.createObjectStore('dialogs', { keyPath: 'id' });
            }
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      } catch (e) { idb = null; }

      try {
        if (navigator.storage && navigator.storage.getDirectory) {
          opfsRoot = await navigator.storage.getDirectory();
        }
      } catch (e) { opfsRoot = null; }

      try {
        if (typeof caches !== 'undefined') cache = await caches.open('sysFault');
      } catch (e) { cache = null; }

      if (SS) {
        try {
          for (let i = 0; i < SS.length; i++) {
            const k = SS.key(i);
            if (k && k.startsWith('dlg_')) {
              try {
                const d = JSON.parse(SS.getItem(k));
                if (d && d.id) mem.set(d.id, d);
              } catch (e) {}
            }
          }
        } catch (e) {}
      }

      if (idb) {
        try {
          await new Promise(res => {
            const tx = idb.transaction('dialogs');
            const req = tx.objectStore('dialogs').getAll();
            req.onsuccess = () => {
              (req.result || []).forEach(d => { if (d && d.id) mem.set(d.id, d); });
              res();
            };
            req.onerror = res; req.onabort = res;
          });
        } catch (e) {}
      }

      if (cache) {
        try {
          const keys = await cache.keys();
          for (const req of keys) {
            if (req.url.indexOf('/dlg/') === -1) continue;
            try {
              const r = await cache.match(req);
              if (!r) continue;
              const d = await r.json();
              if (d && d.id) mem.set(d.id, d);
            } catch (e) {}
          }
        } catch (e) {}
      }

      if (opfsRoot && typeof opfsRoot.entries === 'function') {
        try {
          for await (const [name, handle] of opfsRoot.entries()) {
            if (!name.startsWith('dlg_') || !name.endsWith('.json')) continue;
            try {
              const f = await handle.getFile();
              const d = JSON.parse(await f.text());
              if (d && d.id) mem.set(d.id, d);
            } catch (e) {}
          }
        } catch (e) {}
      }
    }

    function idbPut(d) {
      if (!idb) return;
      try { idb.transaction('dialogs', 'readwrite').objectStore('dialogs').put(d); }
      catch (e) {}
    }
    function idbDel(id) {
      if (!idb) return;
      try { idb.transaction('dialogs', 'readwrite').objectStore('dialogs').delete(id); }
      catch (e) {}
    }
    function cachePut(d, json) {
      if (!cache) return;
      cache.put('/dlg/' + d.id, new Response(json, {
        headers: { 'Content-Type': 'application/json' }
      })).catch(() => {});
    }
    function cacheDel(id) {
      if (!cache) return;
      cache.delete('/dlg/' + id).catch(() => {});
    }
    function opfsPut(d, json) {
      if (!opfsRoot) return;
      (async () => {
        try {
          const fh = await opfsRoot.getFileHandle('dlg_' + d.id + '.json', { create: true });
          const w = await fh.createWritable();
          await w.write(json);
          await w.close();
        } catch (e) {}
      })();
    }
    function opfsDel(id) {
      if (!opfsRoot) return;
      (async () => { try { await opfsRoot.removeEntry('dlg_' + id + '.json'); } catch (e) {} })();
    }

    function persist(d) {
      const s = shard(d.id);
      const json = JSON.stringify(d);
      if (s === 0) {
        if (SS) {
          try { SS.setItem('dlg_' + d.id, json); return; }
          catch (e) { idbPut(d); return; }
        }
        idbPut(d); return;
      }
      if (s === 1) { idbPut(d); return; }
      if (s === 2) { cachePut(d, json); return; }
      if (s === 3) { opfsPut(d, json); return; }
      idbPut(d);
    }

    function put(d) { mem.set(d.id, d); persist(d); }
    function update(id, patch) {
      const d = mem.get(id);
      if (!d) return;
      Object.assign(d, patch);
      persist(d);
    }
    function remove(id) {
      mem.delete(id);
      if (SS) { try { SS.removeItem('dlg_' + id); } catch (e) {} }
      idbDel(id); cacheDel(id); opfsDel(id);
    }

    async function clear() {
      mem.clear();
      if (SS) {
        try {
          SS.removeItem('warnCount');
          SS.removeItem('dlgCount');
          for (let i = SS.length - 1; i >= 0; i--) {
            const k = SS.key(i);
            if (k && (k.startsWith('dlg_') || k.startsWith('junk_'))) SS.removeItem(k);
          }
        } catch (e) {}
      }
      if (idb) {
        try {
          await new Promise(res => {
            const tx = idb.transaction('dialogs', 'readwrite');
            tx.objectStore('dialogs').clear();
            tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
          });
        } catch (e) {}
      }
      if (cache) {
        try {
          const keys = await cache.keys();
          for (const req of keys) {

  function initAudio() {
    if (ac) {

      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 6;
    comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.2;
    bus = ac.createGain(); bus.gain.value = 0.3;
    bus.connect(comp); comp.connect(ac.destination);
    if (ac.state === 'suspended') ac.resume().catch(() => {});
  }

  function schedule(fn) {
    if (!ac || muted) return;
    if (ac.state === 'running') { fn(); return; }
    ac.resume().then(() => {
      if (ac.state === 'running' && !muted) fn();

  function noiseBuffer(sec) {
    const len = (ac.sampleRate * sec) | 0;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;

  function playPianoDread(vol = 0.25) {
    schedule(() => {
      const t = ac.currentTime, base = 130.81;
      [base, base * 1.0595].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol * (i ? 0.85 : 1), t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o.connect(g); g.connect(bus);
        o.start(t); o.stop(t + 1.7);
      });
    });
  }

  function playJawsPulse(steps = 6, vol = 0.3) {
    schedule(() => {
      let t = ac.currentTime, interval = 0.28;
      for (let i = 0; i < steps; i++) {
        const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
        o1.type = o2.type = 'sawtooth';
        const f = i % 2 ? 55 : 58.3;
        o1.frequency.value = f; o2.frequency.value = f * 1.01;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + interval * 0.9);
        o1.connect(g); o2.connect(g); g.connect(bus);
        o1.start(t); o2.start(t);
        o1.stop(t + interval); o2.stop(t + interval);
        interval *= 0.78; t += interval;
      }
    });
  }

    schedule(() => {
      const t = ac.currentTime;
      const src = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain();
      src.buffer = noiseBuffer(0.3);
      nf.type = 'bandpass'; nf.frequency.value = 1500; nf.Q.value = 0.8;
      ng.gain.setValueAtTime(vol, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      src.connect(nf); nf.connect(ng); ng.connect(bus);
      src.start(t); src.stop(t + 0.3);

      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'sine';

      o.frequency.exponentialRampToValueAtTime(30, t + 0.25);

      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(og); og.connect(bus);

  function hex(len) {
    let s = '';
    for (let i = 0; i < len; i++) s += HEX[(Math.random() * 16) | 0];
    return s;
  }
  function fromSet(set, len) {
    let s = '';
    for (let i = 0; i < len; i++) s += set[(Math.random() * set.length) | 0];
    return s;
  }

  function targetLen() {
    const r = Math.random();
    if (r < 0.85) return 500 + ((Math.random() * 4500) | 0);

    return 20000 + ((Math.random() * 80000) | 0);

  function noiseLine() {
    const len = targetLen();

             '  ' + hex(8 + ((Math.random() * 8) | 0)) + '  ';
      }
    } else if (r < 0.50) {
      while (s.length < len) s += fromSet(BLOB, 32 + ((Math.random() * 64) | 0));
    } else if (r < 0.70) {
      while (s.length < len) {
        s += '[' + OPS[(Math.random() * OPS.length) | 0] + '] ' +

      }
    } else {

    function frame() {
      if (stopped) return;
      for (let i = 0; i < data.length; i += 4) {
        const v = (Math.random() * 256) | 0;
        if (Math.random() < 0.03) {
          data[i]     = (Math.random() * 256) | 0;
          data[i + 1] = (Math.random() * 256) | 0;

        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

  function viewportSize() {
    const vv = window.visualViewport;
    return {
      w: (vv && vv.width)  || window.innerWidth  || document.documentElement.clientWidth  || 0,
      h: (vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 0

  /* ================================================================
     ★ 弹窗定位：用相对比例 rx/ry（0~1）表达位置
     —— 横竖屏、窗口缩放、折叠屏切换时都重新计算
     ================================================================ */
  const live = new Map();   // id -> { el, conf }

  function clampUnit(v) {
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  /**
   * 把配置里的「位置」解析成相对比例 rx/ry：
   *  - 已有 rx/ry → 直接用（新版数据）
   *  - 只有 left/top → 反推（旧版数据，向后兼容）
   *  - 都没有 → 随机
   */
  function resolveRatio(conf, elW, elH, vw, vh) {
    if (typeof conf.rx === 'number' && typeof conf.ry === 'number') {
      return { rx: clampUnit(conf.rx), ry: clampUnit(conf.ry) };
    }
    if (typeof conf.left === 'number' || typeof conf.top === 'number') {
      const maxX = Math.max(1, vw - elW);
      const maxY = Math.max(1, vh - elH);
      return {
        rx: clampUnit((conf.left || 0) / maxX),
        ry: clampUnit((conf.top  || 0) / maxY)
      };
    }
    return { rx: Math.random(), ry: Math.random() };
  }

  /**
   * 根据比例把弹窗放到当前视口合适位置。
   * 返回 { rx, ry, left, top } 方便回写 conf / Storage。
   */
  function placeDialog(el, conf) {
    const { w: vw, h: vh } = viewportSize();
    const elW = el.offsetWidth  || 300;
    const elH = el.offsetHeight || 150;
    const maxX = Math.max(0, vw - elW);
    const maxY = Math.max(0, vh - elH);

    const { rx, ry } = resolveRatio(conf, elW, elH, vw, vh);
    const left = Math.min(Math.max(0, rx * maxX), maxX);
    const top  = Math.min(Math.max(0, ry * maxY), maxY);

    el.style.left = left + 'px';
    el.style.top  = top  + 'px';
    return { rx, ry, left, top };
  }

    if (relayoutScheduled) return;
    relayoutScheduled = true;

      relayoutScheduled = false;
      for (const [id, rec] of live) {
        if (!rec.el.isConnected) { live.delete(id); continue; }
        placeDialog(rec.el, rec.conf);

  function makeDraggable(el, onEnd) {
    const bar = el.querySelector('.titlebar');
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;

    bar.addEventListener('pointerdown', e => {
      if (e.target.hasAttribute('data-x')) return;
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = parseInt(el.style.left, 10) || 0;
      oy = parseInt(el.style.top, 10) || 0;
      el.style.zIndex = 2000 + ((Math.random() * 500) | 0);
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
    });

    bar.addEventListener('pointermove', e => {
      if (!dragging) return;
      el.style.left = (ox + e.clientX - sx) + 'px';
      el.style.top = (oy + e.clientY - sy) + 'px';
    });

    const end = e => {
      if (!dragging) return;
      dragging = false;
      const { w: vw, h: vh } = viewportSize();
      const maxX = Math.max(0, vw - el.offsetWidth);
      const maxY = Math.max(0, vh - el.offsetHeight);
      const x = Math.min(Math.max(0, parseInt(el.style.left, 10) || 0), maxX);
      const y = Math.min(Math.max(0, parseInt(el.style.top, 10) || 0), maxY);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
      if (onEnd) onEnd(x, y);
    };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
  }

        '</div>' +
        '<div class="footer"><button data-ok>确定</button></div>';
      dlg.querySelector('.titlebar span').textContent = conf.title || '';
      dlg.querySelector('.icon').innerHTML = conf.icon
        ? '<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#' + conf.icon + '"/></svg>'
        : '';
      dlg.querySelector('.msg .t').textContent = conf.msg || '';
      dlg.querySelector('.msg .sub').textContent = conf.sub || '';
    }

    document.body.appendChild(dlg);

    /* ★ 用比例定位，并把解析结果回写到 conf / Storage */
    const pos = placeDialog(dlg, conf);
    conf.rx = pos.rx; conf.ry = pos.ry;
    conf.left = pos.left; conf.top = pos.top;
    Storage.update(conf.id, { rx: pos.rx, ry: pos.ry, left: pos.left, top: pos.top });

    dlg.style.zIndex = 1000 + ((Math.random() * 800) | 0);

    live.set(conf.id, { el: dlg, conf });

    const close = () => {
      if (ticker) { ticker.stop(); ticker = null; }
      live.delete(conf.id);
      dlg.remove();
      Storage.remove(conf.id);
    };
    dlg.querySelector('[data-x]').addEventListener('click', close);
    dlg.querySelector('[data-ok]').addEventListener('click', close);

    /* ★ 拖动结束后把绝对坐标反算成比例存起来 */
    makeDraggable(dlg, (px, py) => {
      const { w: vw, h: vh } = viewportSize();
      const maxX = Math.max(1, vw - dlg.offsetWidth);
      const maxY = Math.max(1, vh - dlg.offsetHeight);
      const rx = clampUnit(px / maxX);
      const ry = clampUnit(py / maxY);
      conf.rx = rx; conf.ry = ry;
      conf.left = px; conf.top = py;
      Storage.update(conf.id, { rx, ry, left: px, top: py });
    });

    if (type === 'noise') {
      ticker = startNoiseTicker(dlg);
    } else if (type === 'static') {
      ticker = startStaticTicker(dlg);
    }
  }

  /* ================================================================
     加载历史 + 生成新弹窗
     ================================================================ */
  const allDialogs = Storage.getAll();
  const nextIndex = allDialogs.length + 1;

  /* ★ 新弹窗只用 rx/ry，不带绝对像素，跨屏无缝 */
  let newDlg;
  if (nextIndex % 5 === 0) {
    newDlg = {
      id: uid(), type: 'web',
      title: '系统监控 · 实时画面',
      url: location.pathname,
      rx: Math.random(), ry: Math.random()
    };
  } else if (nextIndex % 4 === 0) {
    newDlg = {
      id: uid(), type: 'noise',
      title: noiseTitles[(Math.random() * noiseTitles.length) | 0],
      rx: Math.random(), ry: Math.random()
    };
  } else if (nextIndex % 3 === 0) {
    newDlg = {
      id: uid(), type: 'static',
      title: staticTitles[(Math.random() * staticTitles.length) | 0],
      rx: Math.random(), ry: Math.random()
    };
  } else {
    const tpl = infoTemplates[(count + allDialogs.length) % infoTemplates.length];
    newDlg = {
      id: uid(), type: 'info',
      icon: tpl.icon, title: tpl.title, msg: tpl.msg, sub: tpl.sub,
      rx: Math.random(), ry: Math.random()
    };
  }

  Storage.put(newDlg);

  const renderOrder = shuffle(allDialogs.slice());
  renderOrder.forEach(d => renderDialog(d));

  /* ================================================================
     音效
     ================================================================ */
  initAudio();
  setTimeout(() => playHorrorScene(n), 80);

  /* ================================================================
     自动重定向
     ================================================================ */
  let cancelled = false;
  let redirectTimer = null;

  function redirect() {
    if (cancelled) return;
    location.replace(location.pathname);
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (cancelled) return;
      redirectTimer = setTimeout(redirect, 500);
    });
  });

  /* ================================================================
     ESC / 点击退出
     ================================================================ */
  let exited = false;

  async function bail() {
    if (exited) {
      await Storage.clear();
      location.replace(location.pathname);
      return;
    }
    exited = true;
    cancelled = true;
    clearTimeout(redirectTimer);
    document.body.classList.add('paused');
    await Storage.clear();
    muted = true;
    escHint.textContent = '[ 已暂停 · 点击重新开始 ]';
    escHint.style.color = '#ff3b30';
    initAudio();
    playExitBeep();
  }

  escHint.addEventListener('click', bail);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      e.preventDefault();
      bail();
    }
  });
})();
</script>
</body>
</html>
